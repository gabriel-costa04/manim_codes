[project]
name = "manim-codes"
version = "0.1.0"
description = "Biblioteca de animações científicas do projeto Dois Físicos e um Vetor"
readme = "README.md"
authors = [
    { name = "gabriel-costa04", email = "gabrielfisi.co@usp.br" }
]
requires-python = ">=3.10"
dependencies = [
    "manim>=0.19.1",
]

[project.scripts]
manim-codes = "manim_codes:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
